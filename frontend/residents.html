<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Residents - Municipal Waste Billing System</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<nav class="navbar">
    <div class="brand">🗑️ Municipal Waste Billing System</div>
    <div class="nav-links">
        <a href="dashboard.html">Dashboard</a>
        <a href="residents.html">Residents</a>
        <a href="bills.html">Bills</a>
        <span class="nav-user" id="navUser"></span>
        <a href="#" id="logoutLink">Logout</a>
    </div>
</nav>

<main class="container">
    <div class="card" style="max-width:100%; margin-bottom:24px;">
        <h3 id="formTitle">Register New Resident</h3>
        <form id="residentForm">
            <div class="form-row">
                <div>
                    <label>Full Name</label>
                    <input type="text" id="name" required>
                </div>
                <div>
                    <label>Holding Number</label>
                    <input type="text" id="holding_number" placeholder="e.g. RCC-W12-0451" required>
                </div>
            </div>
            <label>Address</label>
            <input type="text" id="address" placeholder="e.g. House 14, Road 3, Ward No. 12" required>
            <div class="form-row">
                <div>
                    <label>Phone</label>
                    <input type="text" id="phone" placeholder="e.g. 01712345678">
                </div>
                <div>
                    <label>Category</label>
                    <select id="category">
                        <option value="Household">Household</option>
                        <option value="Commercial">Commercial</option>
                    </select>
                </div>
            </div>
            <button type="submit" class="btn btn-primary">Save</button>
            <button type="button" id="cancelEdit" class="btn btn-secondary" style="display:none;">Cancel Edit</button>
        </form>
    </div>

    <div class="page-header">
        <h2>Registered Residents</h2>
    </div>
    <table class="data-table">
        <tr><th>Holding No.</th><th>Name</th><th>Address</th><th>Phone</th><th>Category</th><th>Actions</th></tr>
        <tbody id="residentsBody">
            <tr><td colspan="6" class="muted">Loading...</td></tr>
        </tbody>
    </table>
</main>

<script src="js/api.js"></script>
<script src="js/nav.js"></script>
<script src="js/residents.js"></script>
</body>
</html>
